[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comrade"
version = "0.7.0"
description = "Post to Mastodon and Bluesky with media attachments."
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Alex Ayars", email = "aayars@gmail.com" }]

dependencies = [
    "click>=8.1",
    "loguru>=0.7",
    "requests>=2.34.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/aayars/comrade"

[project.scripts]
post-media = "comrade.scripts.post_media:main"
